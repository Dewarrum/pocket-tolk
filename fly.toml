# Backend on Fly.io, deployed by .github/workflows/deploy.yml on push to main
# (flyctl deploy --remote-only). Secrets (APP_TOKEN, ALLOWED_ORIGIN, STT_*,
# TRANSLATE_*, TTS_*) are set with `flyctl secrets`, never here.
app = "pocket-tolk"
primary_region = "nrt"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
